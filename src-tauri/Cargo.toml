[package]
name = "emucleaner"
version = "0.2.0"
description = "EmuCleaner: safe cleaner and booster for emulator gamers"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
emucleaner-core = { path = "../core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
